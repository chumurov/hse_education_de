[project]
name = "nosql"
version = "0.1.0"
description = "MongoDB sharded cluster, CLI and benchmark for the university grades project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "typer>=0.24.1",
]

[project.scripts]
nosql-cli = "nosql_app.cli:run"
nosql-benchmark = "nosql_app.benchmark:run"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nosql_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
