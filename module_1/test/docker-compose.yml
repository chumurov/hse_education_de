version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: university_mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./data/json:/data/json
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

volumes:
  mongodb_data:
  
