version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nosql_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-appdb}
    volumes:
      - ./data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - 27017:27017
    healthcheck:
      # Use mongosh if available, fall back to legacy mongo shell
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
